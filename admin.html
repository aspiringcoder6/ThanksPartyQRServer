<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>SOICT Party Admin</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f6f8fc;
      color: #172033;
      font-family: Arial, sans-serif;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 5;
      padding: 14px 18px;
      background: #ffffff;
      border-bottom: 1px solid #dbe3ef;
      box-shadow: 0 2px 10px rgba(15, 23, 42, .06);
    }
    h1 { margin: 0 0 10px; font-size: 22px; color: #102a56; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    input, button {
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      padding: 9px 11px;
      font: inherit;
    }
    input { background: #fff; color: #172033; }
    button {
      border-color: #2563eb;
      background: #2563eb;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    button.secondary { background: #eef6ff; border-color: #93c5fd; color: #1d4ed8; }
    button.good { background: #16a34a; border-color: #16a34a; }
    button.warn { background: #f59e0b; border-color: #f59e0b; color: #111827; }
    button.danger { background: #dc2626; border-color: #dc2626; }
    button:disabled { opacity: .5; cursor: default; }
    .status { margin-top: 8px; color: #2563eb; min-height: 20px; font-weight: 700; }
    main {
      display: grid;
      grid-template-columns: minmax(280px, 30%) minmax(520px, 1fr);
      gap: 16px;
      padding: 16px;
    }
    .panel {
      background: #fff;
      border: 1px solid #dbe3ef;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, .06);
      overflow: hidden;
    }
    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 14px;
      border-bottom: 1px solid #e5eaf2;
      background: #f8fafc;
    }
    .panel-title { font-weight: 900; color: #102a56; }
    .summary { font-size: 13px; color: #64748b; }
    .table-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      padding: 14px;
      max-height: calc(100vh - 170px);
      overflow: auto;
    }
    .table-btn {
      min-height: 58px;
      border: 2px solid #cbd5e1;
      background: #fff;
      color: #102a56;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 3px;
    }
    .table-btn .num { font-size: 18px; font-weight: 900; }
    .table-btn .count { font-size: 12px; color: #64748b; font-weight: 700; }
    .table-btn.full { border-color: #f97316; background: #fff7ed; }
    .table-btn.empty { border-color: #bfdbfe; background: #eff6ff; }
    .table-btn.active { border-color: #2563eb; background: #dbeafe; box-shadow: inset 0 0 0 1px #2563eb; }
    .slots { padding: 14px; display: grid; gap: 10px; }
    .slot {
      min-height: 74px;
      border: 1px solid #dbe3ef;
      border-left: 6px solid #cbd5e1;
      border-radius: 10px;
      background: #ffffff;
      padding: 10px;
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 10px;
      align-items: start;
    }
    .slot.empty { border-left-color: #93c5fd; background: #f8fbff; }
    .slot.checked { border-left-color: #16a34a; background: #f0fdf4; }
    .slot-num {
      height: 28px;
      border-radius: 99px;
      background: #e2e8f0;
      color: #334155;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 900;
    }
    .person-name { font-weight: 900; color: #111827; }
    .person-meta { margin-top: 3px; color: #64748b; font-size: 13px; }
    .check-pill {
      display: inline-block;
      margin-top: 6px;
      padding: 3px 8px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 900;
      background: #fee2e2;
      color: #991b1b;
    }
    .checked .check-pill { background: #dcfce7; color: #166534; }
    .actions {
      display: none;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 9px;
    }
    .slot:hover .actions,
    .slot:focus-within .actions { display: flex; }
    .mini-input { width: 130px; padding: 7px 8px; font-size: 13px; }
    .mini-btn { padding: 7px 9px; font-size: 12px; border-radius: 7px; }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
      .table-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); max-height: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1>SOICT Party Admin</h1>
    <div class="toolbar">
      <button class="secondary" onclick="loadData()">Refresh</button>
      <button class="good" onclick="downloadCsv()">Download CSV</button>
      <button class="danger" onclick="resetCheckins()">Reset check-ins</button>
    </div>
    <div class="status" id="status"></div>
  </header>

  <main>
    <section class="panel">
      <div class="panel-head">
        <div>
          <div class="panel-title">Tables</div>
          <div class="summary" id="summary">Loading...</div>
        </div>
      </div>
      <div class="table-grid" id="tableGrid"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div>
          <div class="panel-title" id="selectedTitle">Table 1</div>
          <div class="summary">Hover a slot to edit. Max 10 people per table.</div>
        </div>
      </div>
      <div class="slots" id="slots"></div>
    </section>
  </main>

  <script>
    const tableGrid = document.getElementById('tableGrid');
    const slotsEl = document.getElementById('slots');
    const statusEl = document.getElementById('status');
    const summaryEl = document.getElementById('summary');
    const selectedTitle = document.getElementById('selectedTitle');

    let tables = [];
    let participants = [];
    let selectedTable = '1';

    function status(message) {
      statusEl.textContent = message;
    }

    async function api(path, options = {}) {
      const res = await fetch(path, {
        ...options,
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    async function loadData() {
      try {
        status('Loading table data...');
        const data = await api('/api/admin/tables');
        tables = data.tables || [];
        participants = data.participants || [];
        renderTables();
        renderSlots();
        status('Ready');
      } catch (err) {
        status(err.message);
      }
    }

    function renderTables() {
      const arrived = participants.filter(p => p.checkedIn).length;
      summaryEl.textContent = `${participants.length} participants | ${arrived} checked in`;
      tableGrid.innerHTML = tables.map(table => {
        const cls = [
          'table-btn',
          table.tableSize >= table.maxSize ? 'full' : '',
          table.tableSize === 0 ? 'empty' : '',
          table.tableNumber === selectedTable ? 'active' : '',
        ].filter(Boolean).join(' ');
        return `
          <button class="${cls}" onclick="selectTable('${escAttr(table.tableNumber)}')">
            <span class="num">${esc(table.tableNumber)}</span>
            <span class="count">${table.tableSize}/${table.maxSize}</span>
          </button>
        `;
      }).join('');
    }

    function renderSlots() {
      const table = tables.find(t => t.tableNumber === selectedTable) || { people: [], maxSize: 10 };
      selectedTitle.textContent = `Table ${selectedTable} - ${table.people.length}/${table.maxSize}`;
      slotsEl.innerHTML = Array.from({ length: table.maxSize }, (_, index) =>
        renderSlot(index, table.people[index])
      ).join('');
    }

    function renderSlot(index, person) {
      if (!person) {
        return `
          <div class="slot empty">
            <div class="slot-num">${index + 1}</div>
            <div>
              <div class="person-name">Empty slot</div>
              <div class="person-meta">Hover to add by MSSV</div>
              <div class="actions">
                <input class="mini-input" id="add-${index}" placeholder="MSSV"/>
                <button class="mini-btn good" onclick="addToTable('add-${index}')">Add</button>
              </div>
            </div>
          </div>
        `;
      }

      const checked = Boolean(person.checkedIn);
      return `
        <div class="slot ${checked ? 'checked' : ''}">
          <div class="slot-num">${index + 1}</div>
          <div>
            <div class="person-name">${esc(person.name)}</div>
            <div class="person-meta">${esc(person.sid)} | ${esc(person.email || '')}</div>
            <span class="check-pill">${checked ? 'Checked in' : 'Not checked in'}</span>
            <div class="actions">
              <button class="mini-btn ${checked ? 'warn' : 'good'}" onclick="toggleCheckin('${escAttr(person.sid)}', ${!checked})">${checked ? 'Undo check-in' : 'Check in'}</button>
              <button class="mini-btn danger" onclick="removeFromTable('${escAttr(person.sid)}')">Remove</button>
              <input class="mini-input" id="move-${index}" placeholder="Move to table"/>
              <button class="mini-btn secondary" onclick="moveToTable('${escAttr(person.sid)}', 'move-${index}')">Move</button>
              <input class="mini-input" id="swap-${index}" placeholder="Swap MSSV"/>
              <button class="mini-btn secondary" onclick="swapWith('${escAttr(person.sid)}', 'swap-${index}')">Swap</button>
            </div>
          </div>
        </div>
      `;
    }

    function selectTable(tableNumber) {
      selectedTable = tableNumber;
      renderTables();
      renderSlots();
    }

    async function addToTable(inputId) {
      const mssv = document.getElementById(inputId).value.trim();
      if (!mssv) return status('Enter MSSV first');
      await mutate('/api/admin/tables/move', { mssv, tableNumber: selectedTable });
    }

    async function moveToTable(mssv, inputId) {
      const tableNumber = document.getElementById(inputId).value.trim();
      if (!tableNumber) return status('Enter target table first');
      await mutate('/api/admin/tables/move', { mssv, tableNumber });
      selectedTable = tableNumber;
    }

    async function removeFromTable(mssv) {
      await mutate('/api/admin/tables/remove', { mssv });
    }

    async function swapWith(mssv, inputId) {
      const otherMssv = document.getElementById(inputId).value.trim();
      if (!otherMssv) return status('Enter MSSV to swap with');
      await mutate('/api/admin/tables/swap', { mssv, otherMssv });
    }

    async function toggleCheckin(mssv, checkedIn) {
      await mutate('/api/admin/checkins/toggle', { mssv, checkedIn });
    }

    async function mutate(path, body) {
      try {
        status('Saving...');
        await api(path, { method: 'POST', body: JSON.stringify(body) });
        await loadData();
      } catch (err) {
        status(err.message);
      }
    }

    async function resetCheckins() {
      if (!confirm('Reset check-in status for all participants?')) return;
      await mutate('/api/admin/checkins/reset', {});
    }

    async function downloadCsv() {
      try {
        status('Preparing CSV...');
        const res = await fetch('/api/admin/participants.csv');
        if (!res.ok) throw new Error('Could not download CSV');
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'participants-checkin.csv';
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
        status('CSV downloaded');
      } catch (err) {
        status(err.message);
      }
    }

    function esc(value) {
      return String(value || '').replace(/[&<>]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[ch]));
    }
    function escAttr(value) {
      return esc(value).replace(/'/g, '&#39;').replace(/"/g, '&quot;');
    }

    window.loadData = loadData;
    window.selectTable = selectTable;
    window.addToTable = addToTable;
    window.moveToTable = moveToTable;
    window.removeFromTable = removeFromTable;
    window.swapWith = swapWith;
    window.toggleCheckin = toggleCheckin;
    window.resetCheckins = resetCheckins;
    window.downloadCsv = downloadCsv;

    loadData();
  </script>
</body>
</html>
